name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.15.10
      - run: ruff check src tests examples

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            stack: minimum
          - os: ubuntu-latest
            python: "3.12"
            stack: current
          - os: macos-latest
            python: "3.12"
            stack: current
          # Exercises the optional adv-jax-math chunking backend. Without this
          # job the backend-parity tests skip everywhere in CI and the optional
          # path is never independently verified.
          - os: ubuntu-latest
            python: "3.12"
            stack: adv
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Install the optional chunking backend
        if: matrix.stack == 'adv'
        run: pip install -e '.[adv]'
      - name: Pin supported-minimum numerical stack
        if: matrix.stack == 'minimum'
        run: >-
          pip install 'jax==0.4.38' 'jaxlib==0.4.38'
          'equinox>=0.11,<0.12' 'lineax>=0.0.7,<0.1'
      - run: python -c "import jax, solvax; print(jax.__version__, solvax.__version__, solvax.__file__)"
      - name: Confirm the optional backend is actually present
        if: matrix.stack == 'adv'
        run: >-
          python -c "from solvax.autodiff import available_backends;
          assert 'adv' in available_backends(), available_backends();
          print('backends:', available_backends())"
      # This collects all of tests/, which already includes the suites that
      # execute the README and the examples, the external-API contracts, and
      # the randomised property checks. Naming any of them again as a separate
      # step would run them a second time, serially, for no extra signal.
      - run: pytest -n auto --cov --cov-report=xml
      - name: Benchmark problem-suite verification
        if: matrix.stack == 'current'
        run: python -m benchmarks.benchmark_sweeps --verify
      - name: Reproduction driver smoke
        if: matrix.stack == 'current' && matrix.os == 'ubuntu-latest'
        run: python -m benchmarks.reproduce --quick
      # Upload from the optional-backend job too, under its own flag. Without
      # it codecov sees a single session from the `current` job, in which the
      # adv-only branches never execute, and reports them as uncovered even
      # though the adv job exercises them.
      - uses: codecov/codecov-action@v4
        if: >-
          matrix.os == 'ubuntu-latest' &&
          (matrix.stack == 'current' || matrix.stack == 'adv')
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.stack }}
          name: ubuntu-${{ matrix.python }}-${{ matrix.stack }}

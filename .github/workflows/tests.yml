name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.15.10
      - run: ruff check src tests examples

  # The package advertises `Typing :: Typed` and ships `py.typed`, so a
  # downstream type-checker trusts these annotations. Nothing verified them
  # until this job existed, which made the marker a promise the repository was
  # not keeping. Modules that do not pass yet are listed in `[tool.mypy]`, so
  # this gate holds the line rather than blocking on pre-existing debt.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mypy==1.20.0 jax numpy
      - run: mypy

  test:
    name: test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            stack: current
            label: ubuntu-3.12-current-1
            suite: current-1
            coverage: true
            files: >-
              tests/test_documentation_runs.py tests/test_per_chain_windows.py
              tests/test_exact_window_adjoint.py tests/test_smoothers.py tests/test_krylov.py
              tests/test_precond.py tests/test_mixed_precision.py tests/test_randomized.py
              tests/test_nonlinear.py tests/test_operators.py tests/test_elliptic.py
              tests/test_transfer.py tests/test_dot_precision.py tests/test_chunk_backends.py
              tests/test_eigen.py tests/test_precond_alfven.py tests/test_native_eigen.py
              tests/test_refine.py tests/test_pcg_benchmark.py tests/test_packaging.py
          - os: ubuntu-latest
            python: "3.12"
            stack: current
            label: ubuntu-3.12-current-2
            suite: current-2
            coverage: true
            files: >-
              tests/test_certified_window.py tests/test_direct.py
              tests/test_exact_window_properties.py tests/test_window_semantics.py
              tests/test_multigrid.py tests/test_tridiagonal.py tests/test_implicit.py
              tests/test_banded.py tests/test_verification_practices.py
              tests/test_scope_and_scaling.py tests/test_autodiff.py tests/test_fixed_point.py
              tests/test_sharded_operands.py tests/test_external_api_contract.py
              tests/test_pcg.py tests/test_propagator.py tests/test_sharding.py
              tests/test_generated_block_benchmark.py
              tests/test_checkpointed_block_benchmark.py tests/test_native.py
          - os: ubuntu-latest
            python: "3.10"
            stack: minimum
            label: ubuntu-3.10-minimum
            suite: compatibility
            coverage: false
          - os: macos-latest
            python: "3.12"
            stack: current
            label: macos-3.12-current
            suite: compatibility
            coverage: false
          - os: ubuntu-latest
            python: "3.12"
            stack: adv
            label: ubuntu-3.12-adv
            suite: adv
            coverage: true
            files: >-
              tests/test_chunk_backends.py tests/test_autodiff.py
              tests/test_external_api_contract.py
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Exhaustive tests and exact combined coverage belong to the two current
      # Linux shards above. Compatibility axes exercise every runtime-facing
      # solver family and JAX transformation seam without duplicating the
      # costly property, benchmark, and documentation suites on each platform.
      COMPATIBILITY_FILES: >-
        tests/test_packaging.py tests/test_external_api_contract.py
        tests/test_tridiagonal.py tests/test_direct.py tests/test_krylov.py
        tests/test_pcg.py tests/test_nonlinear.py tests/test_implicit.py
        tests/test_autodiff.py tests/test_fixed_point.py tests/test_precond.py
        tests/test_multigrid.py tests/test_eigen.py tests/test_sharding.py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Install the optional chunking backend
        if: matrix.stack == 'adv'
        run: pip install -e '.[adv]'
      - name: Pin supported-minimum numerical stack
        if: matrix.stack == 'minimum'
        run: >-
          pip install 'jax==0.4.38' 'jaxlib==0.4.38'
          'equinox>=0.11,<0.12' 'lineax>=0.0.7,<0.1'
      - run: python -c "import jax, solvax; print(jax.__version__, solvax.__version__, solvax.__file__)"
      - name: Confirm the optional backend is actually present
        if: matrix.stack == 'adv'
        run: >-
          python -c "from solvax.autodiff import available_backends;
          assert 'adv' in available_backends(), available_backends();
          print('backends:', available_backends())"
      - name: Run covered test shard
        if: matrix.coverage
        env:
          COVERAGE_FILE: artifacts/coverage/.coverage.${{ matrix.suite }}
        run: |
          mkdir -p artifacts/coverage
          pytest -n auto ${{ matrix.files }} ${{ matrix.pytest_args }} \
            --cov --cov-report= --cov-fail-under=0
      - name: Run compatibility suite
        if: matrix.coverage == false
        run: pytest -n auto $COMPATIBILITY_FILES
      - name: Benchmark problem-suite verification
        if: matrix.suite == 'current-1'
        run: python -m benchmarks.benchmark_sweeps --verify
      - name: Reproduction driver smoke
        if: matrix.suite == 'current-1'
        run: python -m benchmarks.reproduce --quick
      - name: Save covered test evidence
        if: matrix.coverage
        uses: actions/cache/save@v6
        with:
          path: artifacts/coverage/.coverage.${{ matrix.suite }}
          key: solvax-coverage-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}

  coverage:
    name: Combined branch coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install coverage
      - uses: actions/cache/restore@v6
        with:
          path: artifacts/coverage/.coverage.current-1
          key: solvax-coverage-${{ github.run_id }}-${{ github.run_attempt }}-current-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: artifacts/coverage/.coverage.current-2
          key: solvax-coverage-${{ github.run_id }}-${{ github.run_attempt }}-current-2
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: artifacts/coverage/.coverage.adv
          key: solvax-coverage-${{ github.run_id }}-${{ github.run_attempt }}-adv
          fail-on-cache-miss: true
      - run: |
          coverage combine artifacts/coverage
          coverage report --fail-under=95
          coverage xml
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.15.10
      - run: ruff check src tests examples

  # The package advertises `Typing :: Typed` and ships `py.typed`, so a
  # downstream type-checker trusts these annotations. Nothing verified them
  # until this job existed, which made the marker a promise the repository was
  # not keeping. Modules that do not pass yet are listed in `[tool.mypy]`, so
  # this gate holds the line rather than blocking on pre-existing debt.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mypy==1.20.0 jax numpy
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            stack: minimum
          - os: ubuntu-latest
            python: "3.12"
            stack: current
          - os: macos-latest
            python: "3.12"
            stack: current
          # Exercises the optional adv-jax-math chunking backend. Without this
          # job the backend-parity tests skip everywhere in CI and the optional
          # path is never independently verified.
          - os: ubuntu-latest
            python: "3.12"
            stack: adv
    runs-on: ${{ matrix.os }}
    # Thirty rather than fifteen. The suite grows every release and the old
    # budget had stopped being a backstop against a hang and become a race:
    # the last green run finished with fourteen seconds to spare, and the run
    # after it was cancelled mid-step on two platforms. A timeout that trips on
    # ordinary growth reports "cancelled", which reads like a failing test and
    # costs a diagnosis every time. If a job ever genuinely hangs, thirty
    # minutes still catches it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Install the optional chunking backend
        if: matrix.stack == 'adv'
        run: pip install -e '.[adv]'
      - name: Pin supported-minimum numerical stack
        if: matrix.stack == 'minimum'
        run: >-
          pip install 'jax==0.4.38' 'jaxlib==0.4.38'
          'equinox>=0.11,<0.12' 'lineax>=0.0.7,<0.1'
      - run: python -c "import jax, solvax; print(jax.__version__, solvax.__version__, solvax.__file__)"
      - name: Confirm the optional backend is actually present
        if: matrix.stack == 'adv'
        run: >-
          python -c "from solvax.autodiff import available_backends;
          assert 'adv' in available_backends(), available_backends();
          print('backends:', available_backends())"
      # This collects all of tests/, which already includes the suites that
      # execute the README and the examples, the external-API contracts, and
      # the randomised property checks. Naming any of them again as a separate
      # step would run them a second time, serially, for no extra signal.
      # Executing every example spawns one subprocess each. What that checks
      # is that the code runs at all, which is not platform-specific, so one
      # OS is enough --- and running it on the slower macOS runner as well was
      # what first pushed that job past its time limit.
      - run: pytest -n auto --cov --cov-report=xml
        if: matrix.os == 'ubuntu-latest'
      - run: pytest -n auto --cov --cov-report=xml -m "not slow_examples"
        if: matrix.os != 'ubuntu-latest' 
      - name: Benchmark problem-suite verification
        if: matrix.stack == 'current'
        run: python -m benchmarks.benchmark_sweeps --verify
      - name: Reproduction driver smoke
        if: matrix.stack == 'current' && matrix.os == 'ubuntu-latest'
        run: python -m benchmarks.reproduce --quick
      # Upload from the optional-backend job too, under its own flag. Without
      # it codecov sees a single session from the `current` job, in which the
      # adv-only branches never execute, and reports them as uncovered even
      # though the adv job exercises them.
      - uses: codecov/codecov-action@v4
        if: >-
          matrix.os == 'ubuntu-latest' &&
          (matrix.stack == 'current' || matrix.stack == 'adv')
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.stack }}
          name: ubuntu-${{ matrix.python }}-${{ matrix.stack }}

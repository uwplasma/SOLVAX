[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solvax"
description = "Differentiable structured linear solvers, preconditioners and matrix-free methods in JAX"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "UW Plasma", email = "rogerio.jorge@wisc.edu" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["equinox", "jax"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/uwplasma/SOLVAX"
Documentation = "https://solvax.readthedocs.io"

[project.optional-dependencies]
# Optional chunking backend. Kept optional on purpose: adv-jax-math pins a
# narrower JAX range than SOLVAX supports, and SOLVAX must not constrain the
# JAX version of the codes that depend on it.
# The lower bound stays. Removing *upper* bounds is the right policy -- a
# solver library must not cap the JAX its dependents may use -- but a lower
# bound is the opposite thing: without it an old adv-jax-math resolves and
# fails on an API it never had, at import time, far from the cause.
adv = ["adv-jax-math>=1.1"]
native = ["scipy"]
dev = ["pytest", "pytest-cov", "pytest-xdist", "scipy", "numpy", "ruff"]
bench = ["lineax", "scipy"]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "sphinx-copybutton",
  "sphinxcontrib-bibtex",
]

[tool.hatch.version]
path = "src/solvax/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/solvax"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv",
  "/.venv/**",
  "/.venv-*",
  "/.venv-*/**",
]

[tool.mypy]
# No `python_version` pin: numpy's bundled stubs use 3.12 type syntax, so
# asking mypy to analyse them as 3.10 fails in numpy itself before it reaches
# any SOLVAX code. The runtime floor is enforced by the test matrix instead.
ignore_missing_imports = true          # jax and friends ship partial stubs
files = ["src/solvax"]

# The package advertises `Typing :: Typed` and ships `py.typed`, so downstream
# type-checkers trust these annotations. That promise is only worth something
# if something checks them, which nothing did: the marker shipped without a
# gate, which is strictly worse than either shipping neither or shipping both.
#
# Nine modules do not pass yet. Every failure inspected was an annotation-
# quality issue or a limitation of inference through `jax.lax.scan` carries and
# `tuple(genexpr)` -- none was a live bug -- so they are silenced per module
# rather than papered over with blanket ignores, and the count is recorded so
# the debt is visible and can be paid down module by module. Anything not
# listed here is checked, and a new module starts out checked.
[[tool.mypy.overrides]]
module = [
  "solvax.fixed_point",     # 3
  "solvax.implicit",        # 1
  "solvax.krylov",          # 6
  "solvax.operators",       # 3
  "solvax.pcg",             # 1
  "solvax.precond",         # 9
  "solvax.smoothers",       # 4
  "solvax.tridiagonal",     # 1
]
ignore_errors = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "slow_examples: spawns a subprocess per example; what it checks is that the code runs, which is not platform-specific, so CI runs it on one OS only",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/solvax"]

[tool.coverage.report]
fail_under = 95
show_missing = true
